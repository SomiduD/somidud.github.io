<svg viewBox="0 0 220 360" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="coatG" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#9c6b43"/><stop offset="0.5" stop-color="#c08a5c"/><stop offset="1" stop-color="#9c6b43"/>
  </linearGradient>
  <radialGradient id="skinG" cx="45%" cy="38%" r="65%">
    <stop offset="0" stop-color="#d9a273"/><stop offset="1" stop-color="#b57d51"/>
  </radialGradient>
  <linearGradient id="jeanG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#2b3445"/><stop offset="1" stop-color="#171d29"/>
  </linearGradient>
  <radialGradient id="glowG" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#00f5ff" stop-opacity="0.55"/><stop offset="1" stop-color="#7b2fff" stop-opacity="0"/>
  </radialGradient>
  <style>
    .body-bob { animation: bob 3s ease-in-out infinite; transform-origin: 110px 340px; }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    .wave { animation: wave 1.6s ease-in-out infinite; transform-origin: 156px 116px; }
    @keyframes wave { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(-150deg); } }
    .wave-pause { animation: wave 5s ease-in-out infinite; }
    .eyes { animation: blink 4.2s infinite; transform-origin: 110px 64px; }
    @keyframes blink { 0%,92%,100% { transform: scaleY(1); } 96% { transform: scaleY(0.08); } }
    .head { animation: tilt 5s ease-in-out infinite; transform-origin: 110px 96px; }
    @keyframes tilt { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(2.5deg); } }
    .scarf-tail { animation: sway 2.6s ease-in-out infinite; transform-origin: 122px 120px; }
    @keyframes sway { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(5deg); } }
    .float-code { animation: floaty 2.8s ease-in-out infinite; }
    @keyframes floaty { 0%,100% { transform: translateY(0); opacity: .85; } 50% { transform: translateY(-8px); opacity: 1; } }
  </style>
</defs>

<ellipse cx="110" cy="346" rx="52" ry="7" fill="#000" opacity="0.28"/>
<circle cx="110" cy="190" r="104" fill="url(#glowG)"/>

<g class="float-code">
  <rect x="8" y="150" width="46" height="24" rx="8" fill="#0f1224" stroke="#00f5ff" stroke-width="1.5"/>
  <text x="31" y="167" font-family="Fira Code, monospace" font-size="13" font-weight="700" fill="#00f5ff" text-anchor="middle">&lt;/&gt;</text>
</g>

<g class="body-bob">
  <!-- legs -->
  <rect x="82" y="248" width="24" height="86" rx="6" fill="url(#jeanG)"/>
  <rect x="114" y="248" width="24" height="86" rx="6" fill="url(#jeanG)"/>
  <!-- sneakers -->
  <path d="M76 334 Q76 322 90 322 L106 322 L108 340 L76 340 Z" fill="#f4f4f5"/>
  <path d="M144 334 Q144 322 130 322 L114 322 L112 340 L144 340 Z" fill="#f4f4f5"/>
  <rect x="76" y="336" width="32" height="5" rx="2" fill="#00f5ff"/>
  <rect x="112" y="336" width="32" height="5" rx="2" fill="#00f5ff"/>

  <!-- left arm (static) -->
  <path d="M66 114 Q40 142 44 226 L66 230 Q68 156 84 126 Z" fill="url(#coatG)"/>
  <rect x="42" y="218" width="26" height="9" rx="4" fill="#7a5233"/>
  <circle cx="55" cy="236" r="10" fill="url(#skinG)"/>

  <!-- coat body -->
  <path d="M64 112 Q110 96 156 112 L172 282 L48 282 Z" fill="url(#coatG)"/>
  <!-- inner tee -->
  <path d="M90 106 L110 196 L130 106 Z" fill="#111827"/>
  <text x="110" y="150" font-family="Fira Code, monospace" font-size="11" font-weight="700" fill="#00f5ff" text-anchor="middle">{ }</text>
  <!-- lapels -->
  <path d="M90 104 L66 152 L98 214 L108 160 Z" fill="#a8764b"/>
  <path d="M130 104 L154 152 L122 214 L112 160 Z" fill="#a8764b"/>
  <path d="M90 104 L66 152 L74 154 L96 112 Z" fill="#d1a077"/>
  <path d="M130 104 L154 152 L146 154 L124 112 Z" fill="#d1a077"/>
  <!-- coat hem + pockets + buttons -->
  <path d="M48 282 L172 282 L173 290 L47 290 Z" fill="#8a5c38"/>
  <rect x="64" y="226" width="30" height="5" rx="2" fill="#8a5c38"/>
  <rect x="126" y="226" width="30" height="5" rx="2" fill="#8a5c38"/>
  <circle cx="98" cy="214" r="3" fill="#3b2a1b"/>
  <circle cx="122" cy="214" r="3" fill="#3b2a1b"/>
  <!-- belt -->
  <path d="M52 236 Q110 246 168 236 L169 246 Q110 256 51 246 Z" fill="#7a4e2c" opacity="0.9"/>
  <rect x="104" y="238" width="12" height="12" rx="2" fill="none" stroke="#e5c07b" stroke-width="2"/>

  <!-- neck + scarf -->
  <rect x="99" y="90" width="22" height="22" rx="6" fill="#b57d51"/>
  <path d="M84 102 Q110 124 136 102 L138 118 Q110 136 82 118 Z" fill="#7b2fff"/>
  <g class="scarf-tail"><path d="M122 120 L136 122 L140 168 L124 164 Z" fill="#6420d8"/>
    <path d="M124 150 L140 154 M124 142 L139 146" stroke="#00f5ff" stroke-width="2"/></g>

  <!-- right arm (waving) -->
  <g class="wave">
    <path d="M154 114 Q180 142 176 214 L154 218 Q154 156 138 126 Z" fill="url(#coatG)"/>
    <rect x="152" y="206" width="26" height="9" rx="4" fill="#7a5233"/>
    <circle cx="166" cy="224" r="10" fill="url(#skinG)"/>
  </g>

  <!-- head -->
  <g class="head">
    <ellipse cx="80" cy="66" rx="5" ry="8" fill="#b57d51"/>
    <ellipse cx="140" cy="66" rx="5" ry="8" fill="#b57d51"/>
    <ellipse cx="110" cy="62" rx="30" ry="35" fill="url(#skinG)"/>
    <!-- hair -->
    <path d="M78 60 Q74 20 112 18 Q146 18 142 60 Q138 42 124 38 Q110 46 92 38 Q82 44 78 60 Z" fill="#17100d"/>
    <path d="M92 30 Q112 8 138 30 Q120 22 92 30 Z" fill="#17100d"/>
    <!-- brows -->
    <path d="M88 55 Q98 50 106 55" stroke="#17100d" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M114 55 Q122 50 132 55" stroke="#17100d" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- eyes -->
    <g class="eyes">
      <ellipse cx="97" cy="65" rx="6" ry="5" fill="#fff"/><circle cx="98" cy="65" r="3.2" fill="#2a1608"/><circle cx="99" cy="63.8" r="1.1" fill="#fff"/>
      <ellipse cx="123" cy="65" rx="6" ry="5" fill="#fff"/><circle cx="124" cy="65" r="3.2" fill="#2a1608"/><circle cx="125" cy="63.8" r="1.1" fill="#fff"/>
    </g>
    <!-- glasses -->
    <circle cx="97" cy="65" r="11" fill="#00f5ff" fill-opacity="0.08" stroke="#0b1020" stroke-width="2.4"/>
    <circle cx="123" cy="65" r="11" fill="#00f5ff" fill-opacity="0.08" stroke="#0b1020" stroke-width="2.4"/>
    <path d="M108 64 Q110 62 112 64" stroke="#0b1020" stroke-width="2.2" fill="none"/>
    <path d="M86 64 L80 62 M134 64 L140 62" stroke="#0b1020" stroke-width="2"/>
    <!-- nose -->
    <path d="M108 74 Q110 80 113 76" stroke="#8d5b36" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <!-- stubble -->
    <path d="M86 82 Q110 108 134 82 Q130 96 110 98 Q90 96 86 82 Z" fill="#17100d" opacity="0.22"/>
    <!-- smile -->
    <path d="M98 86 Q110 96 122 86" stroke="#5c2f1c" stroke-width="2.4" fill="#fff" stroke-linecap="round"/>
  </g>
</g>
</svg>

